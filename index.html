<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="low budget nasties">
<meta name="theme-color" content="#0c0b0a">
<title>200 Games — low budget nasties</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="cabinet" aria-label="200 Games television">
  <section class="screen" aria-label="Channel 200">
    <div class="grid" aria-hidden="true"></div>
    <header><span class="mark">200<span> GAMES</span></span><span class="channel">AV 01 <i></i></span></header>
    <div class="hero">
      <div class="copy"><p class="eyebrow">CHANNEL 200</p><h1>LOW BUDGET<br><em>NASTIES.</em></h1></div>
      <div class="product" role="img" aria-label="Black retro game controller with a red and white 200 sticker">
        <img class="poster" src="./assets/controller.webp" alt="">
        <canvas id="controller"></canvas>
      </div>
    </div>
    <footer><span><i></i> <span id="signal">SIGNAL LIVE</span></span><span>NTSC / 60 HZ</span></footer>
    <canvas id="snow" aria-hidden="true"></canvas><div class="glass" aria-hidden="true"></div>
    <div class="standby" hidden>STANDBY</div>
  </section>
  <aside class="controls" aria-label="Television controls">
    <div class="vents" aria-hidden="true"></div>
    <button type="button" id="power" aria-label="TV power" aria-pressed="true">⏻</button>
    <button type="button" id="motion" aria-label="Animate controller and static" aria-pressed="true">Ⅱ</button>
    <span class="lamp" aria-hidden="true"></span>
  </aside>
  <div class="plate" aria-hidden="true">200<span> / </span>GAMES</div>
</main>
<script defer src="./site.js"></script>
</body>
</html>
